# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: PR build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
        - os: macos-latest
          python-version: "3.14"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build pylint pytest "setuptools>=77"
    - name: Build source distribution and wheel
      run: |
        python -m build
        python -m pip install dist/*.whl
        python -m pip check
    - name: Lint with pylint
      run: |
        pylint source_parser test/source_parser setup.py --recursive=y
    - name: Copy tests outside the source checkout
      run: |
        python -c "import os, pathlib, shutil; shutil.copytree('test', pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-parser-tests' / 'test')"
    - name: Test the installed wheel
      working-directory: ${{ runner.temp }}/source-parser-tests
      run: python -m pytest test/
    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: dist-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/*