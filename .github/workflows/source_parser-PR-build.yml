# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: PR build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
        - os: macos-latest
          python-version: "3.14"

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: recursive
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build pylint pytest
    - name: Build source distribution and wheel
      run: |
        python -m build
        python -m pip install dist/*.whl
        python -m pip check
    - name: Lint with pylint
      run: |
        pylint source_parser test/source_parser setup.py --recursive=y
    - name: Copy tests outside the source checkout
      run: |
        python -c "import os, pathlib, shutil; shutil.copytree('test', pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-parser-tests' / 'test')"
    - name: Test the installed wheel
      working-directory: ${{ runner.temp }}/source-parser-tests
      run: python -m pytest test/
    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: dist-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/*